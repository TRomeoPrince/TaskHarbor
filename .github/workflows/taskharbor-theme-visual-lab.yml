name: TaskHarbor synthetic browser visual lab
on:
  workflow_dispatch:
  push:
    branches:
      - feature/taskharbor-marketplace-20261116
permissions:
  contents: read
jobs:
  visual-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install project and temporary browser test dependency
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Check real rendered Light/Dark experience against synthetic fixtures
        run: node test/theme-browser.mjs
      - name: Upload lab screenshots and measured styles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskharbor-light-dark-lab
          path: artifacts/theme-lab/
          retention-days: 7
          if-no-files-found: warn
