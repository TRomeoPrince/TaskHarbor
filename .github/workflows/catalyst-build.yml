name: Catalyst deployment package
on:
  push:
    branches: [feature/catalyst-task-workflows, feature/contact-notifications]
  pull_request:
    branches: [catalyst-neon-staging, feature/catalyst-task-workflows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --omit=dev
      - name: Package runtime without private data
        run: |
          mkdir -p /tmp/taskharbor-runtime
          git ls-files -z '*.js' '*.json' '*.sql' 'public/*' 'templates/*' | tar --null -T - -cf - | tar -xf - -C /tmp/taskharbor-runtime
          cp -R node_modules /tmp/taskharbor-runtime/
          git rev-parse HEAD > /tmp/taskharbor-runtime/DEPLOYED_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taskharbor-catalyst
          path: /tmp/taskharbor-runtime/
          retention-days: 7
